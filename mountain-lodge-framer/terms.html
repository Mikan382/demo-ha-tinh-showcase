framer-font-size:61px;--framer-line-height:0.9em;--framer-text-alignment:center;--framer-text-color:var(--extracted-1of0zx5, var(--token-9a179da7-721d-488b-a170-9120ed25d2dc, rgb(217, 190, 226)))" class="framer-text"></div><main class="framer-1xkt1yg"><div class="framer-1vw49z7 hidden-1cmmf86 hidden-1rv7jhb" id="nav-bar"></div><div class="framer-qoztth" style="outline: none; display: flex; flex-direction: column; justify-content: flex-start; flex-shrink: 0; opacity: 1; transform: perspective(1200px) translateX(0px) translateY(0px) scale(1) rotate(0deg) rotateX(0deg) rotateY(0deg) skewX(0deg) skewY(0deg) translateZ(0px);" data-framer-component-type="RichTextContainer"><h2 class="framer-text framer-styles-preset-1mdy01g" data-styles-preset="W43JcLMZr">Điều khoản & Điều kiện</h2></div><div class="framer-olxz1p" style="opacity: 1; transform: perspective(1200px) translateX(0px) translateY(0px) scale(1) rotate(0deg) rotateX(0deg) rotateY(0deg) skewX(0deg) skewY(0deg) translateZ(0px);"><div class="framer-14ljfc2" data-border="true"><div class="framer-qznhpv" style="outline:none;display:flex;flex-direction:column;justify-content:flex-start;flex-shrink:0;transform:none" data-framer-component-type="RichTextContainer"><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">1. Introduction</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Chào mừng bạn đến với Ke Go Eco Lodge, khu nghỉ dưỡng sinh thái boutique tọa lạc giữa vùng núi hồ Kẻ Gỗ, Hà Tĩnh. Bằng cách truy cập trang web và đặt phòng với chúng tôi, bạn đồng ý tuân thủ và chịu sự ràng buộc của các điều khoản và điều kiện sau. Vui lòng đọc kỹ trước khi thực hiện đặt phòng.<br class="framer-text"><br class="framer-text trailing-break"></p><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">2. Đặt phòng và Thanh toán</h2><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">2.1 Reservation</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Việc đặt phòng có thể thực hiện thông qua trang web, điện thoại hoặc email. Tất cả các yêu cầu đặt phòng đều tùy thuộc vào tình trạng phòng trống và sự xác nhận của chúng tôi.</p><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">2.2 Payment</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Yêu cầu đặt cọc 30% tổng chi phí đặt phòng để đảm bảo giữ chỗ của bạn. Số tiền còn lại sẽ thanh toán khi nhận phòng. Chúng tôi chấp nhận các loại thẻ tín dụng phổ biến, chuyển khoản ngân hàng và tiền mặt.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">3. Chính sách Hủy phòng</h2><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">3.1 Cancellations</h2><ul class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))"><li class="framer-text"><p style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))" class="framer-text">Yêu cầu hủy phòng được thực hiện trước ngày nhận phòng hơn 30 ngày sẽ được hoàn trả toàn bộ tiền đặt cọc.</p></li><li class="framer-text"><p style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))" class="framer-text">Yêu cầu hủy phòng được thực hiện từ 15 đến 30 ngày trước ngày nhận phòng sẽ chịu phí 50% tổng chi phí đặt phòng.</p></li><li class="framer-text"><p style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))" class="framer-text">Yêu cầu hủy phòng được thực hiện dưới 15 ngày trước ngày nhận phòng sẽ tính 100% tổng chi phí đặt phòng.</p></li></ul><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">3.2 Vắng mặt (No-Show)</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Khách hàng không đến nhận phòng mà không có thông báo trước sẽ bị tính phí toàn bộ chi phí đặt phòng.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">4. Nhận phòng và Trả phòng</h2><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">4.1 Nhận phòng</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Thời gian nhận phòng là từ 15:00. Nhận phòng sớm tùy thuộc vào tình trạng phòng trống và có thể tính thêm phí.</p><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">4.2 Trả phòng</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Thời gian trả phòng là trước 11:00. Trả phòng muộn có thể được hỗ trợ theo yêu cầu và có thể tính thêm phí.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">5. Trách nhiệm của Khách hàng</h2><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">5.1 Conduct</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Khách hàng cần cư xử có trách nhiệm, tôn trọng tài sản, nhân viên và các khách hàng khác. Mọi hư hại do khách hàng gây ra sẽ bị tính phí tương ứng.</p><h2 class="framer-text framer-styles-preset-k56d9" data-styles-preset="eHsk0gPcu" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">5.2 Safety</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Khách hàng phải tuân thủ tất cả các quy định an toàn và hướng dẫn do khu nghỉ cung cấp.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">6. Liability</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Ke Go Eco Lodge không chịu trách nhiệm đối với bất kỳ mất mát, hư hỏng hoặc mất cắp tài sản cá nhân nào. Chúng tôi khuyến nghị khách hàng nên mua bảo hiểm du lịch phù hợp.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">7. Privacy</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">We are committed to protecting your privacy. Any personal information provided during the booking process will be used in accordance with our Chính sách bảo mật.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">8. Thay đổi Điều khoản</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Ke Go Eco Lodge bảo lưu quyền sửa đổi các điều khoản và điều kiện này bất kỳ lúc nào. Mọi thay đổi sẽ được đăng tải trên trang web của chúng tôi và có hiệu lực ngay lập tức.<br class="framer-text"><br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">9. Luật áp dụng</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">These terms and conditions are governed by and construed in accordance with the laws of Hà Tĩnh. Any disputes arising out of or in connection with these terms shall be subject to the exclusive jurisdiction of the courts of Hà Tĩnh.<br class="framer-text"><br class="framer-text trailing-break"></p><h2 class="framer-text framer-styles-preset-1itxynn" data-styles-preset="pqeDmxWnq" style="--framer-text-alignment:left;--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">Liên hệ</h2><p class="framer-text framer-styles-preset-qjuhi8" data-styles-preset="BKhV3S4gF" style="--framer-text-color:var(--token-9e7f51fd-1f8e-4b58-8605-a308417176b3, rgb(34, 39, 37))">If you have any questions about our Điều khoản & Điều kiện, please <a class="framer-text framer-styles-preset-9tq283" data-styles-preset="wq2abTel9" href="contact.html">liên hệ với chúng tôi</a>.</p></div></div></div></main><div class="framer-1gcfcfp" data-framer-name="Newsletter" id="newsletter" name="Newsletter"><div class="framer-1w5jw4p"><div class="framer-tpa00q" style="outline: none; display: fle
